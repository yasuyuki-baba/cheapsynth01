name: Run built tests

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      platform:
        required: true
        type: string
      build_type:
        required: true
        type: string
      category:
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ inputs.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: Install runtime dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2t64 libgtk-3-0t64 libjack-jackd2-0 libfreetype6 libfontconfig1 libx11-6 libxi6 libxext6 libxcomposite1 libxcursor1 libxinerama1 libxrandr2 libxrender1 xvfb xauth openbox x11-utils
      - name: Download test executable
        uses: actions/download-artifact@v8
        with:
          name: test-executable-${{ inputs.platform }}
          path: build/tests
      - name: Run tests
        working-directory: build
        env:
          CATEGORY: ${{ inputs.category }}
        run: |
          case "$CATEGORY" in
            quick|extended|observations) ;;
            *) echo "Unknown test category: $CATEGORY" >&2; exit 2 ;;
          esac
          executable="./tests/CheapSynth01Tests"
          if [ "$RUNNER_OS" == "Windows" ]; then
            executable="$executable.exe"
          else
            chmod +x "$executable"
          fi
          command=("$executable" "--$CATEGORY" --gtest_output=xml:test_results.xml)
          if [ "$RUNNER_OS" == "Linux" ]; then
            command=(xvfb-run -a bash ../scripts/run-linux-gui-tests.sh "${command[@]}")
          fi
          status=0
          "${command[@]}" > test_output.log 2>&1 || status=$?
          tail -n 30 test_output.log
          if [ "$status" -ne 0 ] && [ -f test_results.xml ]; then
            python3 ../scripts/summarize-test-failures.py test_results.xml
          fi
          exit "$status"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ inputs.platform }}-${{ inputs.category }}
          path: |
            build/test_results.xml
            build/test_output.log
            build/openbox.log
