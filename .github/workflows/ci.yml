name: cheapsynth01-ci

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

env:
  BUILD_TYPE: ${{ github.ref_type == 'tag' && 'Release' || 'Debug' }}

jobs:
  lint:
    name: C++ formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install clang-format
        run: python -m pip install clang-format==21.1.7
      - name: Check formatting
        run: bash scripts/check-format.sh
      - name: Test release packaging checks
        run: python3 Tests/release_validation_test.py -v

  build-and-test:
    name: Build and test (${{ matrix.platform }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev libfreetype6-dev libx11-dev libxi-dev libxext-dev libxcomposite-dev libxcursor-dev libxinerama-dev libxrandr-dev libxrender-dev libfontconfig1-dev libgtk-3-dev lv2-dev xvfb xauth openbox x11-utils
      - name: Validate release version
        if: github.ref_type == 'tag'
        run: python3 scripts/validate-release.py --tag "$GITHUB_REF_NAME"
      - name: Configure
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get install -y ninja-build
          elif [ "$RUNNER_OS" == "macOS" ]; then
            command -v ninja >/dev/null || brew install ninja
          fi
          if [ "$RUNNER_OS" == "Windows" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DSTANDALONE_ONLY=OFF -DBUILD_TESTING=ON
          elif [ "$RUNNER_OS" == "Linux" ]; then
            cmake -G Ninja -B build -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DSTANDALONE_ONLY=OFF -DBUILD_TESTING=ON -DCMAKE_SKIP_RPATH=ON
          else
            cmake -G Ninja -B build -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DSTANDALONE_ONLY=OFF -DBUILD_TESTING=ON
          fi
      - name: Build
        run: cmake --build build --config "$BUILD_TYPE" --parallel 2
      - name: Run tests
        working-directory: build
        run: |
          executable="./Tests/CheapSynth01Tests_artefacts/$BUILD_TYPE/CheapSynth01Tests"
          if [ "$RUNNER_OS" == "Windows" ]; then
            "$executable.exe" --gtest_output=xml:test_results.xml
          elif [ "$RUNNER_OS" == "Linux" ]; then
            xvfb-run -a bash ../scripts/run-linux-gui-tests.sh "$executable" --gtest_output=xml:test_results.xml
          else
            "$executable" --gtest_output=xml:test_results.xml
          fi
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ runner.os }}
          path: build/test_results.xml
      - name: Upload products
        uses: actions/upload-artifact@v7
        with:
          name: cheapsynth01-${{ matrix.platform }}
          path: |
            build/CheapSynth01_artefacts/${{ env.BUILD_TYPE }}/Standalone/*
            build/CheapSynth01_artefacts/${{ env.BUILD_TYPE }}/VST3/*
            build/CheapSynth01_artefacts/${{ env.BUILD_TYPE }}/AU/*
            build/CheapSynth01_artefacts/${{ env.BUILD_TYPE }}/LV2/*
            build/CheapSynth01_artefacts/${{ env.BUILD_TYPE }}/CLAP/*
          if-no-files-found: error
      - name: Stage distribution notices
        if: github.ref_type == 'tag'
        run: python3 scripts/package-notices.py --products "build/CheapSynth01_artefacts/$BUILD_TYPE" --juce build/_deps/juce-src
      - name: Package corresponding source
        if: github.ref_type == 'tag' && runner.os == 'Linux'
        run: python3 scripts/package-source.py --juce build/_deps/juce-src --googletest build/_deps/googletest-src --output release-packages/cheapsynth01-source.zip
      - name: Package for release (Linux and macOS)
        if: github.ref_type == 'tag' && runner.os != 'Windows'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p release-packages
          cd "build/CheapSynth01_artefacts/$BUILD_TYPE"
          formats=(Standalone VST3 LV2 CLAP)
          if [ "$RUNNER_OS" == "macOS" ]; then
            formats+=(AU)
          fi
          for format in "${formats[@]}"; do
            zip -r "$GITHUB_WORKSPACE/release-packages/cheapsynth01-$PLATFORM-$(echo "$format" | tr '[:upper:]' '[:lower:]').zip" "$format/"
          done
      - name: Package for release (Windows)
        if: github.ref_type == 'tag' && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -Path "release-packages" -ItemType Directory -Force
          $buildDir = Join-Path $env:GITHUB_WORKSPACE "build\CheapSynth01_artefacts\$env:BUILD_TYPE"
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "release-packages"
          Compress-Archive -Path "$buildDir\Standalone\*" -DestinationPath "$releaseDir\cheapsynth01-windows-standalone.zip" -Force
          Compress-Archive -Path "$buildDir\VST3\*" -DestinationPath "$releaseDir\cheapsynth01-windows-vst3.zip" -Force
          Compress-Archive -Path "$buildDir\CLAP\*" -DestinationPath "$releaseDir\cheapsynth01-windows-clap.zip" -Force
      - name: Upload release packages
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: cheapsynth01-${{ matrix.platform }}-packages
          path: release-packages/*.zip
          if-no-files-found: error
          retention-days: 5

  create-release:
    needs: build-and-test
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          pattern: cheapsynth01-*-packages
          path: release-packages
          merge-multiple: true
      - uses: actions/checkout@v6
      - name: Validate release assets
        run: python3 scripts/validate-release.py --tag "$GITHUB_REF_NAME" --assets release-packages
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-packages/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
