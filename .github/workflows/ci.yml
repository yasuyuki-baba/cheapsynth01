name: CI
on:
  push:
    branches: [main, master, wip/iplug2-migration]
    tags: ['*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install clang-format
        run: python -m pip install clang-format==21.1.7
      - name: Check formatting
        run: bash scripts/check-format.sh
      - name: Test release archive and signing preparation
        run: python -m unittest discover -s Tests/packaging -v
      - name: Check historical assertion closeout
        run: python scripts/check-test-inventory.py
      - name: Check conditional hardware equations
        run: python -m unittest discover -s Tests/research -v
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v6
      - name: Configure core tests
        run: cmake -S . -B build-core -DBUILD_PLUGINS=OFF -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
      - name: Build
        run: cmake --build build-core --config ${{ matrix.configuration }} --parallel 2
      - name: Test
        shell: bash
        run: |
          if ! ctest --test-dir build-core -C ${{ matrix.configuration }} --output-on-failure --output-junit test-results.xml > build-core/test-output.log 2>&1; then
            python scripts/summarize-test-failures.py build-core/test-results.xml
            tail -80 build-core/test-output.log
            exit 1
          fi
          tail -25 build-core/test-output.log
      - name: Upload core test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-tests-${{ runner.os }}-${{ matrix.configuration }}
          path: |
            build-core/test-results.xml
            build-core/test-output.log
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - name: Fetch iPlug2 and pinned plugin SDKs
        run: bash scripts/setup-iplug2.sh
      - name: Configure
        run: cmake -S . -B build-native -DCMAKE_BUILD_TYPE=Release -DBUILD_PLUGINS=ON -DIPLUG_DEPLOY_PLUGINS=OFF
      - name: Build native products and core tests
        run: cmake --build build-native --config Release --parallel 2
      - name: Test core
        run: |
          if ! ctest --test-dir build-native -C Release --output-on-failure --output-junit test-results.xml > build-native/test-output.log 2>&1; then
            python scripts/summarize-test-failures.py build-native/test-results.xml
            tail -80 build-native/test-output.log
            exit 1
          fi
          tail -25 build-native/test-output.log
      - name: Upload native test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-tests-${{ runner.os }}
          path: |
            build-native/test-results.xml
            build-native/test-output.log
      - name: Upload native products
        uses: actions/upload-artifact@v7
        with:
          name: cheapsynth01-iplug2-${{ runner.os }}
          path: build-native/out/
          if-no-files-found: error
      - name: Package and verify native products without loading plugins
        run: python scripts/release_package.py create --build build-native --platform "${RUNNER_OS}" --output "release-packages/cheapsynth01-${RUNNER_OS}.zip"
      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: cheapsynth01-${{ runner.os }}-packages
          path: release-packages/*.zip
          if-no-files-found: error
          retention-days: 5
  source-package:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fetch pinned SDKs
        run: bash scripts/setup-iplug2.sh
      - name: Fetch core dependencies
        run: cmake -S . -B build-source -DBUILD_PLUGINS=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Package and verify complete source
        run: python scripts/release_package.py create --build build-source --platform source --output release-packages/cheapsynth01-source.zip
      - name: Verify offline build from extracted source
        run: |
          mkdir build-source-extracted
          cd build-source-extracted
          cmake -E tar xf ../release-packages/cheapsynth01-source.zip
          cmake -S . -B build-offline -DBUILD_PLUGINS=OFF -DBUILD_VST3_BOUNDARY_TESTS=ON -DCMAKE_BUILD_TYPE=Release -DFETCHCONTENT_FULLY_DISCONNECTED=ON -DFETCHCONTENT_SOURCE_DIR_TINYXML2="$PWD/dependencies/tinyxml2" -DFETCHCONTENT_SOURCE_DIR_GOOGLETEST="$PWD/dependencies/googletest"
          cmake --build build-offline --parallel 2
          ctest --test-dir build-offline --output-on-failure
      - uses: actions/upload-artifact@v7
        with:
          name: cheapsynth01-source-packages
          path: release-packages/cheapsynth01-source.zip
          if-no-files-found: error
          retention-days: 5
  create-release:
    needs: [lint, core, native, source-package]
    if: github.ref_type == 'tag'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: cheapsynth01-*-packages
          path: release-packages
          merge-multiple: true
      - name: Verify release identity and write checksums
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          for platform in Windows macOS source; do
            python scripts/release_package.py verify --commit "$GITHUB_SHA" --version "$version" --platform "$platform" "release-packages/cheapsynth01-${platform}.zip"
          done
          cd release-packages
          shasum -a 256 *.zip > SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release-packages/*.zip
            release-packages/SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
