name: CI
on:
  push:
    branches: [main, master]
    tags: ['*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install clang-format
        run: python -m pip install clang-format==21.1.7
      - name: Check formatting
        run: bash scripts/check-format.sh
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v6
      - name: Configure core tests
        run: cmake -S . -B build-core -DBUILD_PLUGINS=OFF -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
      - name: Build
        run: cmake --build build-core --config ${{ matrix.configuration }} --parallel 2
      - name: Test
        run: ctest --test-dir build-core -C ${{ matrix.configuration }} --output-on-failure
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - name: Fetch iPlug2 and pinned plugin SDKs
        run: bash scripts/setup-iplug2.sh
      - name: Configure
        run: cmake -S . -B build-native -DCMAKE_BUILD_TYPE=Release -DBUILD_PLUGINS=ON -DIPLUG_DEPLOY_PLUGINS=OFF
      - name: Build native products and core tests
        run: cmake --build build-native --config Release --parallel 2
      - name: Test core
        run: ctest --test-dir build-native -C Release --output-on-failure
      - name: Upload native products
        uses: actions/upload-artifact@v7
        with:
          name: cheapsynth01-iplug2-${{ runner.os }}
          path: build-native/out/
          if-no-files-found: error
      - name: Package native products for release
        if: github.ref_type == 'tag'
        run: |
          mkdir -p release-packages
          cd build-native
          cmake -E tar cf "../release-packages/cheapsynth01-${RUNNER_OS}.zip" --format=zip out
      - name: Upload release package
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: cheapsynth01-${{ runner.os }}-packages
          path: release-packages/*.zip
          if-no-files-found: error
          retention-days: 5
  create-release:
    needs: [lint, core, native]
    if: github.ref_type == 'tag'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cheapsynth01-*-packages
          path: release-packages
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-packages/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
